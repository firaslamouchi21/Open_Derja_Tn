services:
  postgres:
    build:
      context: ../..
      dockerfile: devops/docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendarja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opendarja}
      POSTGRES_DB: ${POSTGRES_DB:-opendarja}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendarja}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    build:
      context: ../..
      dockerfile: devops/docker/pgbouncer.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@postgres:5432/${POSTGRES_DB:-opendarja}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
    ports:
      - "6532:5432"

  redis:
    build:
      context: ../..
      dockerfile: devops/docker/redis.Dockerfile
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nlp:
    build:
      context: ../../nlp
      dockerfile: ../devops/docker/nlp.Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  processing:
    build:
      context: ../../processing
      dockerfile: ../devops/docker/processing.Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  default:
    name: opendarja_net
