services:
  postgres:
    build:
      context: ../..
      dockerfile: devops/docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendarja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opendarja}
      POSTGRES_DB: ${POSTGRES_DB:-opendarja}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5532:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendarja}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    build:
      context: ../..
      dockerfile: devops/docker/pgbouncer.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@postgres:5432/${POSTGRES_DB:-opendarja}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 200
      AUTH_TYPE: scram-sha-256
    ports:
      - "6532:5432"

  redis:
    build:
      context: ../..
      dockerfile: devops/docker/redis.Dockerfile
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nlp:
    build:
      context: ../../intelligence-plane/nlp
      dockerfile: ../../devops/docker/nlp.Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  processing:
    build:
      context: ../../data-plane
      dockerfile: ../devops/docker/processing.Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: devops/docker/migrate.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@pgbouncer:5432/${POSTGRES_DB:-opendarja}?pgbouncer=true
      DIRECT_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@postgres:5432/${POSTGRES_DB:-opendarja}
    restart: "no"

  backend:
    build:
      context: ../..
      dockerfile: devops/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@pgbouncer:5432/${POSTGRES_DB:-opendarja}?pgbouncer=true
      DIRECT_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@postgres:5432/${POSTGRES_DB:-opendarja}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-32chars}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3001}
      PORT: 3000
      IP_HASH_SALT: ${IP_HASH_SALT:-dev-only-salt}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /repo/control-plane/backend/.storage
      STORAGE_LOCAL_BASE_URL: http://localhost:3000
      STORAGE_LOCAL_SECRET: ${STORAGE_LOCAL_SECRET:-dev-only-secret}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: devops/docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@pgbouncer:5432/${POSTGRES_DB:-opendarja}?pgbouncer=true
      DIRECT_URL: postgres://${POSTGRES_USER:-opendarja}:${POSTGRES_PASSWORD:-opendarja}@postgres:5432/${POSTGRES_DB:-opendarja}
      REDIS_URL: redis://redis:6379

  frontend:
    build:
      context: ../..
      dockerfile: devops/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  pgdata:

networks:
  default:
    name: opendarja_net
